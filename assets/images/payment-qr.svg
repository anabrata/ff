  <rect x="150" y="45" width="20" height="10" fill="#000000"/>

  <rect x="90" y="65" width="10" height="10" fill="#000000"/>
  <rect x="110" y="65" width="30" height="10" fill="#000000"/>
  <rect x="150" y="65" width="10" height="10" fill="#000000"/>

  <rect x="25" y="90" width="10" height="20" fill="#000000"/>
  <rect x="45" y="90" width="20" height="10" fill="#000000"/>
  <rect x="75" y="90" width="15" height="10" fill="#000000"/>
  <rect x="100" y="90" width="20" height="10" fill="#000000"/>
