<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="platGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="35%" stop-color="#14b8a6" />
      <stop offset="70%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>
    <linearGradient id="platShine" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ccfbf1" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <filter id="glowPlat" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#14b8a6" flood-opacity="0.8"/>
    </filter>
  </defs>
  <!-- Cyber Hexagonal Crest -->
  <polygon points="60,4 114,30 114,90 60,116 6,90 6,30" fill="url(#platGrad)" stroke="#5eead4" stroke-width="3" filter="url(#glowPlat)"/>
  <polygon points="60,16 100,38 100,82 60,104 20,82 20,38" fill="#042f2e" stroke="#2dd4bf" stroke-width="2"/>
  <!-- Wing Elements -->
  <path d="M22 38 L2 22 L10 78 Z" fill="url(#platShine)"/>
  <path d="M98 38 L118 22 L110 78 Z" fill="url(#platShine)"/>
  <!-- Central Diamond Shield -->
  <polygon points="60,24 86,48 60,96 34,48" fill="url(#platShine)"/>
  <polygon points="60,34 76,52 60,82 44,52" fill="#134e4a"/>
  <!-- Platinum Emblem Blade -->
  <polygon points="60,40 66,54 78,58 68,66 69,76 60,70 51,76 52,66 42,58 54,54" fill="#ccfbf1"/>
</svg>
