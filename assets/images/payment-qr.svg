<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 260" fill="none">
  <rect width="260" height="260" rx="16" fill="#ffffff"/>
  <!-- Corner Position Detectors (Top-Left) -->
  <rect x="25" y="25" width="55" height="55" rx="6" fill="#000000"/>
  <rect x="33" y="33" width="39" height="39" rx="3" fill="#ffffff"/>
  <rect x="41" y="41" width="23" height="23" rx="2" fill="#000000"/>

  <!-- Corner Position Detectors (Top-Right) -->
  <rect x="180" y="25" width="55" height="55" rx="6" fill="#000000"/>
  <rect x="188" y="33" width="39" height="39" rx="3" fill="#ffffff"/>
  <rect x="196" y="41" width="23" height="23" rx="2" fill="#000000"/>

  <!-- Corner Position Detectors (Bottom-Left) -->
  <rect x="25" y="180" width="55" height="55" rx="6" fill="#000000"/>
  <rect x="33" y="188" width="39" height="39" rx="3" fill="#ffffff"/>
  <rect x="41" y="196" width="23" height="23" rx="2" fill="#000000"/>

