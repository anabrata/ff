  <!-- Center UPI Badge Area -->
  <rect x="98" y="98" width="64" height="64" rx="8" fill="#ffffff" stroke="#00f3ff" stroke-width="2"/>
  <rect x="104" y="104" width="52" height="52" rx="6" fill="#0f172a"/>
  <!-- UPI Triangle Logo -->
  <polygon points="120,116 142,126 120,136" fill="#00f3ff"/>
  <polygon points="135,124 145,138 128,138" fill="#ffaa00"/>
  <text x="130" y="151" font-family="sans-serif" font-size="8" font-weight="900" fill="#ffffff" text-anchor="middle">UPI</text>

  <!-- Bottom pixels -->
  <rect x="90" y="170" width="20" height="10" fill="#000000"/>
  <rect x="120" y="170" width="10" height="10" fill="#000000"/>
  <rect x="140" y="170" width="20" height="10" fill="#000000"/>
  <rect x="170" y="170" width="20" height="10" fill="#000000"/>
  <rect x="200" y="170" width="10" height="10" fill="#000000"/>
  <rect x="220" y="170" width="15" height="20" fill="#000000"/>

  <rect x="90" y="190" width="10" height="20" fill="#000000"/>
  <rect x="110" y="200" width="25" height="10" fill="#000000"/>
  <rect x="145" y="190" width="15" height="20" fill="#000000"/>
  <rect x="170" y="200" width="30" height="10" fill="#000000"/>
  <rect x="210" y="200" width="20" height="10" fill="#000000"/>

  <rect x="90" y="220" width="30" height="15" fill="#000000"/>
