<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" fill="none">
  <defs>
    <linearGradient id="logoCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="logoPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007a"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#00f3ff" flood-opacity="0.8"/>
    </filter>
  </defs>
  <!-- Futuristic Shield Crest Icon -->
  <g transform="translate(4, 5)">
    <polygon points="25,2 48,15 48,35 25,48 2,35 2,15" fill="#090d16" stroke="url(#logoCyan)" stroke-width="2.5" filter="url(#logoGlow)"/>
    <path d="M12 25 L25 12 L38 25 L25 38 Z" fill="none" stroke="url(#logoPink)" stroke-width="2"/>
    <circle cx="25" cy="25" r="4" fill="#00f3ff"/>
    <line x1="2" y1="25" x2="8" y2="25" stroke="#00f3ff" stroke-width="2"/>
    <line x1="42" y1="25" x2="48" y2="25" stroke="#00f3ff" stroke-width="2"/>
  </g>
  <!-- Text Brand: ANAHOUSE -->
  <text x="60" y="28" font-family="'Orbitron', sans-serif" font-size="20" font-weight="900" fill="#ffffff" letter-spacing="2">
    ANA<tspan fill="#00f3ff">HOUSE</tspan>
  </text>
  <text x="61" y="44" font-family="'Rajdhani', sans-serif" font-size="9" font-weight="700" fill="#a1a1aa" letter-spacing="3.5">
    FREE FIRE STORE
  </text>
</svg>
